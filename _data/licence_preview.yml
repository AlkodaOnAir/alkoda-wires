  ref_step1: "Give your referral code to a friend. You’ll find it in the License window of Wires."
  ref_step2: "Your friend enters this code in their License window of Wires, then chooses a subscription."
  ref_step3: "After 15 days, the free months are added automatically to both licenses."
  ref_gains: "Free subscription months for each person"
