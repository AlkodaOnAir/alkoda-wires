  one_computer: "1 computer"
  pro_duration: "<b class=\"lic-duree\">1</b>-year subscription"
  ent_duration: "<b class=\"lic-duree\">1</b>-year subscription"
  renewal: "Renewal can be cancelled<br>at any time"
