en:
  title: "Upcoming Wires plans | Free, Fast, Pro and Ent."
  description: "Preview the Free, Fast, Pro and Ent. plans coming with Wires 1.6.0, including Wires Cloud and the benefits reserved for early Wires Pro buyers."
  coming_title: "New Wires plans — coming soon"
  coming_text: "This page presents the plans launching with Wires 1.6.0. They are not available yet."
  hero: "Choose the options that fit your projects."
  intro_lead: "Starting with version 1.6.0, Wires will also offer subscription plans."
  cloud_before: "Many users asked to save and share their projects online."
  cloud_after: "was created to meet that need. With"
  cloud_between: "and"
  cloud_end: "subscriptions, all updates are included for the duration of the subscription, without being limited to one major version. Major new features are also in development for <strong>Wires 2.0.0</strong>..."
  free_before: "The"
  free_after: "edition keeps growing too. <strong>Wires 1.6.0</strong> adds device IP addresses, image rotation, custom device-name positioning, custom titles for PDF exports, and a <strong>Pack List</strong> with a counter. Image Search also remains available at no charge."
  fast_before: "We have also considered those who occasionally need every local Wires feature. That is why we offer"
  fast_after: ", a 30-day license with a one-time payment."
  pioneers: "To thank Wires' early adopters, every <strong>Wires Pro</strong> license purchased before version 1.6.0 launches remains valid for every 1.X.X version and includes <strong>12 months</strong> of Wires Pro at no charge when Wires 2.0.0 launches."
  pioneers_q: "Already bought Wires Pro 1.5.0, or buying it now?"
  pioneers_gain: "You will get Wires 1.6 Pro and receive 12 months of subscription at no charge when Wires 2.0.0 launches"
  target_free: "To discover Wires"
  target_fast: "For occasional needs"
  target_pro: "For regular use"
  target_ent: "For team use"
  free_forever: "Free forever"
  no_account: "No account required"
