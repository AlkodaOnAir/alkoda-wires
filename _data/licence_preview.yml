  ten_computers: "10 computers"
  coupon_note: "A 100% discount coupon will be sent when Wires 2.0.0 launches."
  tax_note: "Prices exclude tax. Tax is added at checkout where applicable."
  subscription_note: "For the duration of the subscription."
  more_seats: "More than 10 computers?"
  write_us: "Contact us"
  more_features: "… and many more features"
  elsewhere_before: "Zones, Pack List, signal routes, Interactive HTML Canvas:"
  elsewhere_bold: "all of these are included in Wires Free."
  elsewhere_after: "Elsewhere, these are paid features."
  stop_title: "Subscription ended? Your projects stay with you."
  stop_p1: "Wires automatically switches to Free. You can still open, view and edit every project stored on your computer, even if it already contains more than 10 devices. You can also edit existing devices and their images with Image Search."
  stop_p2: "With Wires Free, you can create and complete projects with up to 10 devices, contribute to the image catalog, and export documents as 75 dpi PDFs. Wires remains available offline, with no time limit."
  stop_p3: "You can start a paid plan again at any time to immediately restore its features and Wires Cloud."
