    - { text: "10 devices per project", class: "limited" }
    - { text: "PDF export 75 dpi", class: "limited" }
    - { text: "Zones" }
    - { text: "Front / Rear views ↻" }
    - { text: "Signal route animation" }
    - { text: "Text labels" }
    - { text: "Interactive HTML Canvas" }
    - { text: "Custom colors" }
    - { text: "IP address per device", new: true }
    - { text: "Device-name positioning", new: true }
    - { text: "Image rotation", new: true }
    - { text: "Pack List with counter", new: true }
    - { text: "Animated wireless connections" }
    - { text: "Improved online image search", new: true }
    - { text: "Resizable geometric shapes", new: true }

fr:
  title: "Prochaines offres Wires | Free, Fast, Pro et Ent."
  description: "Découvrez en avant-première les offres Free, Fast, Pro et Ent. prévues avec Wires 1.6.0, Wires Cloud et l'avantage réservé aux pionniers de Wires Pro."
  coming_title: "Nouvelles offres Wires — disponibles prochainement"
  coming_text: "Cette page présente les offres qui accompagneront la sortie de Wires 1.6.0. Elles ne sont pas encore disponibles."
  hero: "Choisissez les options adaptées à vos projets."
  intro_lead: "À partir de la version 1.6.0, Wires propose également des offres par abonnement."
  cloud_before: "De nombreux utilisateurs souhaitaient pouvoir sauvegarder et partager leurs projets en ligne."
  cloud_after: "a été créé pour répondre à cette demande. Avec les abonnements"
  cloud_between: "et"
  cloud_end: ", toutes les mises à jour sont incluses pendant la durée de l’abonnement, sans limitation à une version majeure. De grandes nouveautés sont également en préparation pour <strong>Wires 2.0.0</strong>..."
  free_before: "La version"
  free_after: "continue elle aussi de s’enrichir. <strong>Wires 1.6.0</strong> ajoute notamment l’adresse IP des appareils, la rotation des images, le positionnement personnalisé du nom des appareils, des titres personnalisés pour les exports PDF et une <strong>Liste de Paquetage</strong> avec compteur. La recherche d’images reste également accessible gratuitement."
  fast_before: "Nous avons également pensé à ceux qui ont ponctuellement besoin de toutes les fonctionnalités locales de Wires. C’est pourquoi nous proposons"
  fast_after: ", une licence de 30 jours à paiement unique."
  pioneers: "Pour remercier les pionniers de Wires, toutes les licences <strong>Wires Pro</strong> achetées avant la sortie de la version 1.6.0 restent valables pour toutes les versions 1.X.X et donnent droit à <strong>12 mois</strong> de Wires Pro offerts dès la sortie de Wires 2.0.0."
  pioneers_q: "Vous avez déjà acheté Wires Pro 1.5.0 ou vous l’achetez maintenant ?"
  pioneers_gain: "Vous obtiendrez 1.6 Pro et gagnerez 12 mois d’abonnement offerts dès la sortie de Wires 2.0.0"
